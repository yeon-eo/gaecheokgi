const SCALE = [146.83, 155.56, 196, 220, 233.08, 293.66, 311.13, 392, 440, 466.16, 587.33];
function bgmLoop(){
  if (!AU.ctx) return;
  clearTimeout(AU.timer);
  if (!usingFile() && !(usingYT() && MUSIC.ytReady) && S && S.settings.bgm && AU.ctx.state === 'running' && !document.hidden){
    const t = AU.ctx.currentTime + 0.05, r = Math.random();
    if (r < 0.7){ const f = SCALE[3 + Math.floor(Math.random()*8)]; tone(f, t, 1.8, 'triangle', .18, AU.bgm); tone(f*2, t, 0.6, 'sine', .04, AU.bgm); }
    if (r < 0.12) tone(SCALE[0], t, 4, 'sine', .12, AU.bgm);
    if (r > 0.9){ const f = SCALE[5 + Math.floor(Math.random()*5)]; tone(f, t, 1.2, 'triangle', .12, AU.bgm); tone(f*1.5, t + .18, 1.2, 'triangle', .08, AU.bgm); }

function sfx(n){
  if (!AU.ctx || !S || !S.settings.sfx) return;
  const t = AU.ctx.currentTime + 0.01;

    switch(n){
      case 'click': tone(880, t, .06, 'sine', .12); break;
      case 'page': noise(t, .12, .06, 2600); break;
      case 'soft': tone(392, t, .5, 'triangle', .2); break;
      case 'go': tone(293.66, t, .25, 'triangle', .2); tone(440, t+.1, .4, 'triangle', .2); break;
      case 'win': [392,440,587.33,783.99].forEach((f,i) => tone(f, t+i*.09, .5, 'triangle', .2)); break;
      case 'level': [293.66,392,466.16,587.33,783.99].forEach((f,i) => tone(f, t+i*.08, .7, 'triangle', .22)); break;
      case 'rare': case 'bell': tone(1174.66, t, 1.2, 'sine', .16); tone(1567.98, t+.08, 1.2, 'sine', .1); break;
      case 'fail': tone(196, t, .4, 'sawtooth', .1, AU.sfx, 120); break;
      case 'hit': noise(t, .1, .25, 700); break;
      case 'coin': tone(1318.5, t, .12, 'square', .06); tone(1760, t+.07, .18, 'square', .06); break;
      case 'eat': tone(523.25, t, .15, 'sine', .15); tone(659.25, t+.1, .2, 'sine', .15); break;

}

// 유튜브 IFrame 플레이어 (화면 밖에 숨겨 두고 소리만 반복)

// 웹사이트 버전: 파일을 작은 조각으로 나눠 Firestore에 담는다 (별도 저장소 없이). 한 번 받은 곡은 기기에 보관.
const CHUNK = 700 * 1024, FS_MAX = 8 * 1024 * 1024;

async function loadFsMusic(){
  const c = MUSIC.cfg; if (!c || MUSIC.loading || ST.mode !== 'cloud' || !ST.db) return;
  MUSIC.loading = true;
  try {
    let blob = null, cache = null;
    try { cache = await caches.open('gc-bgm'); const hit = await cache.match('/bgm/' + c.ver); if (hit) blob = await hit.blob(); } catch(e){}
    if (!blob){
      const parts = [];
      for (let i = 0; i < c.n; i++){ const d = await ST.db.doc(`bgmchunks/${c.ver}_${i}`).get(); if (!d.exists) throw new Error('chunk'); parts.push(unb64(d.data().d)); }
      blob = new Blob(parts, {type:c.type || 'audio/mpeg'});

async function musicUpload(file){
  if (!isOp()) return;
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if (window.FB_MODE){
    if (!['mp3','m4a','mp4','ogg','wav','aac','webm'].includes(ext) && !/^audio|^video/.test(file.type)) return toast('mp3·m4a·ogg 같은 음악 파일을 올려 주세요.', 'warn');
    if (file.size > FS_MAX) return toast('8MB 이하 파일만 올릴 수 있습니다. (3~4분짜리 mp3 정도)', 'warn');
    MUSIC.busy = true; MUSIC.prog = 0; renderSheet();
    try {
      const u8 = new Uint8Array(await file.arrayBuffer()), n = Math.ceil(u8.length / CHUNK), ver = uid36() + now().toString(36);
      for (let i = 0; i < n; i++){ await ST.db.doc(`bgmchunks/${ver}_${i}`).set({d:b64(u8.subarray(i*CHUNK, (i+1)*CHUNK)), i}); MUSIC.prog = Math.round((i+1)/n*100); renderSheet(); }
      const old = MUSIC.cfg;
      const type = file.type || (ext === 'mp3' ? 'audio/mpeg' : ext === 'ogg' ? 'audio/ogg' : ext === 'wav' ? 'audio/wav' : 'audio/mp4');
      await ST.db.doc('config/bgm').set({kind:'fs', ver, n, type, name:file.name.slice(0, 60), size:file.size, ts:now()});
      if (old && old.kind === 'fs') for (let i = 0; i < old.n; i++) ST.db.doc(`bgmchunks/${old.ver}_${i}`).delete().catch(() => {});
      toast('배경음을 바꿨습니다. 모든 개척자에게 반복 재생됩니다.', 'good');
    } catch(e){ console.warn(e); toast('파일을 올리지 못했습니다. 보안 규칙(V4)을 게시했는지 확인해 주세요.', 'warn'); }
    MUSIC.busy = false; renderSheet(); return;
  }
  if (file.size > 20*1024*1024) return toast('20MB 이하 파일만 올릴 수 있습니다.', 'warn');
  const type = ext === 'webm' || /webm/.test(file.type) ? 'video/webm' : 'video/mp4';
  if (!['mp4','m4a','webm','m4v'].includes(ext) && !/mp4|m4a|webm/.test(file.type)) return toast('이 화면에서는 mp4·webm 동영상이나 m4a 파일을 올려 주세요. (mp3는 웹사이트 버전에서 올릴 수 있습니다)', 'warn');
  const assets = await claude.use('assets');
  if (!assets) return toast('이 화면에서는 파일을 올릴 수 없습니다. 게임 페이지를 직접 열어 주세요.', 'warn');
  MUSIC.busy = true; renderSheet();
  try {
    const r = await assets.upload(file, {type});
    const old = MUSIC.cfg;
    await ST.db.doc('config/bgm').set({id:r.id, url:r.url, name:file.name.slice(0, 60), ts:now()});
    if (old && old.id && old.id !== r.id) assets.delete(old.id).catch(() => {});
    toast('배경음을 바꿨습니다. 모든 개척자에게 반복 재생됩니다.', 'good');
  } catch(e){
    toast(e && e.code === 'unsupported_type' ? '이 파일 형식은 올릴 수 없습니다. mp4·webm 동영상으로 바꿔 올려 주세요.' : e && e.code === 'quota_exceeded' ? '파일 저장 공간이 가득 찼습니다.' : '파일을 올리지 못했습니다.', 'warn');

}

function startReel(){
  const meter = $('#meter'), zone = $('#zone'), fm = $('#fishm'), pr = $('#fprog'), tm = $('#ftime'), btn = $('#holdBtn'), water = $('#water');
  if (!meter) return;
  const Hm = meter.clientHeight - 6, zh = Hm*zoneFrac(), d = FG.fish.d;
  Object.assign(FG, {z:0, v:0, f:Hm*0.4, ft:Hm*0.5, nt:0, prog:30, hold:false, start:performance.now(), last:performance.now()});
  zone.style.height = zh + 'px';
  const on = e => { e.preventDefault(); FG.hold = true; }, off = () => { if (FG) FG.hold = false; };
  [btn, water].forEach(x => { x.addEventListener('pointerdown', on); x.addEventListener('pointerup', off); x.addEventListener('pointercancel', off); x.addEventListener('pointerleave', off); });
  const step = ts => {
    if (!FG || FG.st !== 'reel') return;
    const dt = Math.min(0.05, (ts - FG.last)/1000); FG.last = ts;
    FG.v += (FG.hold ? 1100 : -850) * dt; FG.v = clamp(FG.v, -420, 420); FG.z += FG.v*dt;
    if (FG.z < 0){ FG.z = 0; FG.v = 0; } if (FG.z > Hm - zh){ FG.z = Hm - zh; FG.v = 0; }
    FG.nt -= dt; if (FG.nt <= 0){ FG.ft = Math.random()*Hm; FG.nt = (1.5 - d*0.18) * (0.5 + Math.random()); }
    const sp = (50 + d*42) * dt; FG.f += clamp(FG.ft - FG.f, -sp, sp);
    const inZ = FG.f >= FG.z && FG.f <= FG.z + zh;
    FG.prog += (inZ ? 24 : -(10 + d*3)) * dt;
    zone.style.bottom = (FG.z + 3) + 'px'; fm.style.top = (Hm - FG.f + 3) + 'px'; pr.style.width = clamp(FG.prog,0,100) + '%';
    zone.style.background = inZ ? 'color-mix(in srgb, var(--moss) 70%, transparent)' : '';
    const left = 20 - (ts - FG.start)/1000; tm.textContent = Math.max(0, Math.ceil(left));
    if (FG.prog >= 100) return reelEnd(true);
    if (FG.prog <= 0 || left <= 0) return reelEnd(false);
    FG.raf = requestAnimationFrame(step);
  };
  FG.raf = requestAnimationFrame(step);
}

function readPhoto(file){
  const r = new FileReader();
  r.onload = () => { const img = new Image(); img.onload = () => {
    const c = document.createElement('canvas'), n = 160; c.width = c.height = n; const s = Math.min(img.width, img.height);
    c.getContext('2d').drawImage(img, (img.width - s)/2, (img.height - s)/2, s, s, 0, 0, n, n);
    snapForm(); TMP.photo = c.toDataURL('image/jpeg', 0.82); render();
  }; img.onerror = () => toast('이미지를 읽지 못했습니다.', 'warn'); img.src = r.result; };
  r.readAsDataURL(file);
}

  if (S.nest && now() >= S.nest.at + S.nest.dur) notify('hatch', '부화', '둥지의 알이 움직이기 시작했습니다!', 'nest' + S.nest.at);
  checkTitles();
  presenceTick(); chatSync(); battleTick();
  if (window.FB_MODE && now() % 5000 < 1000) pushSync();
  if (S.settings.infGold && isOp() && S.gold < 99999999){ S.gold = 99999999; }
  S.pen.forEach(a => { if (a.fed && now() >= a.readyAt) notify('harvest', '축사', `${a.name}에게서 ${IT[ANIMALS[a.kind].out[0]].n}${pp(IT[ANIMALS[a.kind].out[0]].n,'을','를')} 거둘 수 있습니다.`, 'pen' + a.id + a.readyAt); });
  if (ST.mode === 'cloud' && !document.hidden && now() - (window._hb || 0) > 3*MIN){ window._hb = now(); writePub(true); }
  if (ST.mode === 'cloud'){
    downedList().forEach(d => notify('rescue', '구조 요청', `${d.p.name}님이 ${REG[d.p.exp.region].n}에서 쓰러졌습니다. 게시판에서 도울 수 있습니다.`, 'dn' + d.rk));
    checkRaidBattles();
  }
  const sig = JSON.stringify([expState()?.st, S.task && now() >= S.task.start + S.task.dur, S.farm.map(f => f && now() >= f.at + f.dur), S.nest && now() >= S.nest.at + S.nest.dur, !!foodActive(), !!tiredActive(), S.short.d === dayKey(), RAIDS.map(r => now() < r.startAt), downedList().length, penReady(), penHungry(), baseLocked(), S.loc, !!S.travel, S.travel ? travelLines(S.travel).filter(l => l.at <= now()).length : 0]);
  if (sig !== lastSig){ const first = !lastSig; lastSig = sig; if (!first){ render(); renderSheet(true); } }
}

// ===================== 시작 =====================
function migrate(sv){
  const d = newSave();
  for (const k in d) if (sv[k] === undefined) sv[k] = d[k];
  sv.settings = {...d.settings, ...sv.settings, noti:{...d.settings.noti, ...(sv.settings||{}).noti}};
  sv.social = {...d.social, ...sv.social};
  // V2: 장신구 칸 나누기
  const eq = {...d.equip, ...(sv.equip || {})};
  if (eq.acc !== undefined){ const k = eq.acc; delete eq.acc; if (k && IT[k]){ const sl = IT[k].slot === 'ring' ? 'ring1' : IT[k].slot; if (sl && !eq[sl]) eq[sl] = k; } }
  for (const k of Object.keys(eq)) if (!(k in d.equip)) delete eq[k];
  sv.equip = eq;
  for (const k of ['stats','buffs']) if (!sv[k] || typeof sv[k] !== 'object') sv[k] = {};
  for (const k of ['pen','fav','notis']) if (!Array.isArray(sv[k])) sv[k] = [];
  if (!sv.greet || !sv.greet.ids) sv.greet = {d:'', ids:{}};
  if (!Array.isArray(sv.titlesGot)) sv.titlesGot = ['newbie'];
  if (sv.stats.exp == null && Array.isArray(sv.hist)) sv.stats.exp = sv.hist.length;
  if (sv.stats.yokai == null && sv.codex && sv.codex.mon){ let y = 0, a = 0; for (const [k, n] of Object.entries(sv.codex.mon)) if (MON[k]) (MON[k].t === 'y' ? y += n : a += n); sv.stats.yokai = y; sv.stats.animal = a; }
  return sv;
}

// ===================== Firebase 연동 (웹사이트 함께하기 버전) =====================
// firebase-config.js 에 프로젝트 설정이 들어 있으면 켜진다. 없으면 혼자 하는 버전으로 동작.
let FB = null;
function fbShim(fs){
  const clean = d => JSON.parse(JSON.stringify(d));
  const wd = s => ({id:s.id, exists:!!s.exists, data:() => s.data(), metadata:{}});
  const wq = s => ({docs:s.docs.map(wd), size:s.size, empty:s.empty, metadata:{}, docChanges:() => s.docChanges().map(c => ({type:c.type, doc:wd(c.doc), oldIndex:c.oldIndex, newIndex:c.newIndex}))});
  const docRef = path => { const r = fs.doc(path); return {
    id:r.id, path,
    get: async () => wd(await r.get()),
    set: d => r.set(clean(d)),
    update: d => r.set(clean(d), {merge:true}),
    delete: () => r.delete(),
    acquire: async () => ({acquired:true}),
    onSnapshot: (n, e) => r.onSnapshot(s => n(wd(s)), e || (() => {})),
    collection: p => colRef(path + '/' + p),
  }; };
  const q = ref => ({
    where: (f, o, v) => q(ref.where(f, o, v)), orderBy: (f, d) => q(ref.orderBy(f, d || 'asc')), limit: n => q(ref.limit(n)),
    get: async () => wq(await ref.get()),
    onSnapshot: (n, e) => ref.onSnapshot(s => n(wq(s)), e || (() => {})),
  });
  const colRef = path => { const ref = fs.collection(path); return {...q(ref), path, doc: id => docRef(id ? path + '/' + id : ref.doc().path), add: async d => docRef((await ref.add(clean(d))).path)}; };
  return {doc:docRef, collection:colRef};
}
function fbBoot(){
  applyPrefs(); render();
  try {
    firebase.initializeApp(window.FBCFG);
    FB = {auth:firebase.auth(), fs:firebase.firestore()};
    try { FB.fs.enablePersistence({synchronizeTabs:true}).catch(() => {}); } catch(e){} // 인터넷이 끊겨도 마지막 화면을 볼 수 있게
  } catch(e){ console.error(e); $('#app').innerHTML = `<div class="hero wrap"><h1>개척기</h1><p>서버 설정을 읽지 못했습니다. firebase-config.js 내용을 확인해 주세요.</p></div>`; return; }
  const db = fbShim(FB.fs);
  window.claude = {use: async n => n === 'db' ? db : n === 'user' ? {
    id: async () => FB.auth.currentUser?.uid || null, isOwner: async () => ST.isOwner, canEdit: async () => ST.isOwner, can: async () => true,
    me: async () => ({id:FB.auth.currentUser?.uid || null}) } : null};
  ST.rdb = db; musicWatch(); pushWatch();
  FB.auth.onAuthStateChanged(async u => {
    if (u){
      ST.mode = 'cloud'; ST.db = db; ST.uid = u.uid;
      const owners = (window.FBCFG.owners || []).map(x => String(x).toLowerCase().trim());
      ST.isOwner = owners.includes(String(u.email || '').toLowerCase());
      let sv = null;
      try { sv = await loadSave(); } catch(e){}
      S = sv ? migrate(sv) : newSave();
      if (!S.acct) S.acct = {login:u.email, fb:true, created:now()};
      S.acct.login = u.email;
      if (!sv) await flushSave();
      PREFS.auto = PREFS.auto || {on:true, last:now()}; PREFS.auto.last = now(); savePrefs();
      afterLogin();
    } else {
      unsubs.splice(0).forEach(f => { try { f(); } catch(e){} });
      S = null; ST.mode = 'local'; ST.uid = 'local';
      if (!['login','signup','reset'].includes(AUTHTAB)) AUTHTAB = 'login';
      SCREEN = 'auth'; render();
    }
  });
}
const FB_ERR = {
  'auth/email-already-in-use':'이미 가입된 이메일입니다. 로그인해 주세요.', 'auth/invalid-email':'이메일 주소 형식이 올바르지 않습니다.',
  'auth/weak-password':'비밀번호는 6자 이상이어야 합니다.', 'auth/invalid-credential':'이메일 또는 비밀번호가 맞지 않습니다.',
  'auth/wrong-password':'이메일 또는 비밀번호가 맞지 않습니다.', 'auth/user-not-found':'가입되지 않은 이메일입니다.',
  'auth/too-many-requests':'시도가 너무 많습니다. 잠시 후 다시 해 주세요.', 'auth/network-request-failed':'인터넷 연결을 확인해 주세요.',
  'auth/requires-recent-login':'보안을 위해 로그아웃 후 다시 로그인한 다음 시도해 주세요.', 'auth/missing-email':'이메일을 입력해 주세요.',
  'auth/unauthorized-domain':'이 주소가 Firebase 승인된 도메인에 없습니다. 운영자에게 알려 주세요.',
};
const fbErr = e => (e && e.code && e.code.startsWith('auth/api-key-not-valid')) ? '서버 설정(firebase-config.js의 apiKey)이 맞지 않습니다. 운영자에게 알려 주세요.' : FB_ERR[e && e.code] || ('문제가 생겼습니다. ' + (e && e.code ? `(${e.code})` : ''));

  return `<div class="hero wrap">

async function fbPersist(auto){ try { await FB.auth.setPersistence(auto ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION); } catch(e){} }
if (window.FB_MODE){
  const busy = (on) => { const b = document.querySelector('#app .btn.seal, #app [data-act=fbReset]'); if (b) b.disabled = on; };
  Object.assign(ACT, {
    fbSignup: async () => {
      const em = $('#a_id').value.trim(), pw = $('#a_pw').value, pw2 = $('#a_pw2').value;
      if (pw !== pw2) return $('#a_err').textContent = '비밀번호 확인이 일치하지 않습니다.';
      busy(true); await fbPersist($('#a_auto').checked);
      try { await FB.auth.createUserWithEmailAndPassword(em, pw); } catch(e){ busy(false); $('#a_err').textContent = fbErr(e); }
    },
    fbLogin: async () => {
      busy(true); await fbPersist($('#a_auto').checked);
      try { await FB.auth.signInWithEmailAndPassword($('#a_id').value.trim(), $('#a_pw').value); } catch(e){ busy(false); $('#a_err').textContent = fbErr(e); }
    },
    fbReset: async () => {
      const em = $('#a_id').value.trim();
      try { await FB.auth.sendPasswordResetEmail(em); AUTHTAB = 'login'; render(); toast('재설정 메일을 보냈습니다. 메일함(스팸함 포함)을 확인해 주세요.', 'good'); }
      catch(e){ $('#a_err').textContent = fbErr(e); }

    logout: async () => { clearTimeout(saveT); await flushSave(); closeSheet(); PREFS.auto = null; savePrefs(); AUTHTAB = 'login'; await FB.auth.signOut(); },
    changePw: async () => {
      const v = $('#newpw').value; if (v.length < 6) return toast('비밀번호는 6자 이상이어야 합니다.', 'warn');
      try { await FB.auth.currentUser.updatePassword(v); $('#newpw').value = ''; toast('비밀번호를 바꿨습니다.', 'good'); } catch(e){ toast(fbErr(e), 'warn'); }
    },
    deleteAcct: async () => {
      if (!await ask('계정 삭제', '캐릭터와 모든 기록이 사라집니다.', '삭제하기', true)) return;
      if (!await ask('정말 삭제할까요?', '되돌릴 수 없습니다.', '영구 삭제', true)) return;

        await ST.db.doc(savePath()).delete(); await ST.db.doc(`players/${ST.uid}`).delete();

      } catch(e){ toast(fbErr(e), 'warn'); if (e && e.code === 'auth/requires-recent-login') FB.auth.signOut(); }
    },
  });
  document.addEventListener('change', e => { if (e.target.dataset && e.target.dataset.actChange === 'autoLogin') fbPersist(e.target.checked); });
}
